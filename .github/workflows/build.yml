name: Build tvOS app

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build (unsigned; atvloadly signs it)
        run: |
          xcodebuild \
            -project WebTV.xcodeproj \
            -target WebTV \
            -sdk appletvos \
            -configuration Release \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Package .ipa
        run: |
          mkdir Payload
          cp -R build/Release-appletvos/WebTV.app Payload/
          zip -qry WebTV.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: WebTV-ipa
          path: WebTV.ipa
